# Message passing but Thread 0 writes multiple times 
# so the engine has to find the right CO order among many

arch = "AArch64"
name = "MPsame-4+dmb"
symbolic = ["x", "y"]

[thread.0]
init = { X1 = "x", X3 = "y" }
code = """
	MOV W0,#1
	STR W0,[X1]
	MOV W0,#2
	STR W0,[X1]
	MOV W0,#3
	STR W0,[X1]
	MOV W0,#4
	STR W0,[X1]
	DMB SY
	MOV W0,#1
	STR W0,[X3]
"""

[thread.1]
init = { X1 = "x", X3 = "y" }
code = """
	LDR W2,[X3]
	DMB SY
	LDR W4,[X1]
"""

[final]
expect = "unsat"
assertion = "1:X2 = 1 & 1:X4 = 0"
