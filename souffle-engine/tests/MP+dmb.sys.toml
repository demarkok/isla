arch = "AArch64"
name = "MP+dmb.sys"
symbolic = ["x", "y"]

[thread.0]
init = { X3 = "y", X1 = "x" }
code = """
	MOV W0,#1
	STR W0,[X1]
	DMB SY
	MOV W2,#1
	STR W2,[X3]
"""

[thread.1]
init = { X3 = "x", X1 = "y" }
code = """
	LDR W0,[X1]
	DMB SY
	LDR W2,[X3]
"""

[final]
expect = "unsat"
assertion = "1:X0 = 1 & 1:X2 = 0"
