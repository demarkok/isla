arch = "AArch64"
name = "MPsame-4"
symbolic = ["x", "y"]

[thread.0]
init = { X1 = "x", X3 = "y" }
code = """
	MOV W0,#1
	STR W0,[X1]
	MOV W0,#2
	STR W0,[X1]
	MOV W0,#3
	STR W0,[X1]
	MOV W0,#4
	STR W0,[X1]
	MOV W0,#1
	STR W0,[X3]
"""

[thread.1]
init = { X1 = "x", X3 = "y" }
code = """
	LDR W2,[X3]
	LDR W4,[X1]
	LDR W5,[X1]
	LDR W6,[X1]
	LDR W7,[X1]
"""

[final]
expect = "sat"
assertion = "1:X2 = 1 & 1:X4 = 0 & 1:X5 = 0 & 1:X6 = 0 & 1:X7 = 0"
